<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#102138"/>
      <stop offset="0.55" stop-color="#071525"/>
      <stop offset="1" stop-color="#030913"/>
    </linearGradient>
    <filter id="outerGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.15 0 0 0 0 0.62 0 0 0 0 1 0 0 0 0.65 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="792" height="192" rx="24" fill="url(#panel)" stroke="#274767" stroke-width="3" filter="url(#outerGlow)"/>
  <rect x="5.5" y="5.5" width="789" height="189" rx="22" fill="none" stroke="#10263F" stroke-width="1"/>
</svg>
